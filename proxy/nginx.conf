events {}

http {
    # Log who connected and whether their cert verified -- evidence for the demo.
    log_format zt '$remote_addr "$request" $status '
                  'verify=$ssl_client_verify dn="$ssl_client_s_dn"';
    access_log /dev/stdout zt;
    error_log  /dev/stderr info;

    # Authorization: deny by default. Only a subject DN of exactly "CN=orders" is allowed.
    # "~" = case-sensitive regex; ^...$ anchors make it an exact match.
    map $ssl_client_s_dn $allowed {
        default        0;
        ~^CN=orders$   1;
    }

    upstream payments {
        server payments:8000;
        keepalive 16;          # reuse proxy->payments connections (same for both listeners)
    }

    # mTLS listener: the real zero-trust entry point.
    server {
        listen 8443 ssl;
        ssl_certificate        /etc/nginx/certs/payments-proxy.pem;
        ssl_certificate_key    /etc/nginx/certs/payments-proxy.key;
        ssl_client_certificate /etc/nginx/certs/ca.pem;   # trust ONLY my CA
        ssl_verify_client      on;                        # no valid client cert -> rejected

        location / {
            if ($allowed = 0) { return 403; }
            proxy_pass http://payments;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # Plain HTTP listener: ONLY for the latency benchmark (proxy hop without TLS).
    server {
        listen 8080;

        location / {
            proxy_pass http://payments;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
